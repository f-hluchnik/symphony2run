# fly.toml app configuration file generated for symphony2run on 2026-04-19T14:38:57+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'symphony2run'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'sqlite_data'
  destination = '/app/db'

[http_service]
  internal_port = 8080
  force_https = true
  # Suspend when idle and resume on the next request in a few hundred ms.
  # While suspended, only storage is billed.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  # One Python process with SQLite: about 100 MB.
  size = 'shared-cpu-1x'
  memory = '256mb'
