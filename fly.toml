# fly.toml app configuration file generated for symphony2run on 2026-04-19T14:38:57+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'symphony2run'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'sqlite_data'
  destination = '/app/db'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
