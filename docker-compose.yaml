version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - sqlite_data:/app/db
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  sqlite_data: